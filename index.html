<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="Watchkind — Discover watches worth wearing." />
  <title>Watchkind — Coming Soon</title>

  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --muted: #b8b8b8;
      --line: #2a2a2a;
      --accent: #d2fc00;
      --max: 980px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      width: min(100% - 40px, var(--max));
      margin: 0 auto;
      padding: 54px 0 42px;
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 14px;
    }

    .logo {
      width: clamp(190px, 28vw, 310px);
      height: auto;
      display: block;
    }

    .hero {
      margin-top: clamp(64px, 10vw, 110px);
      max-width: 860px;
    }

    h1 {
      margin: 0;
      font-size: clamp(58px, 9vw, 116px);
      line-height: 0.93;
      letter-spacing: -0.055em;
      font-weight: 800;
      max-width: 900px;
    }

    .intro {
      margin-top: 34px;
      font-size: clamp(22px, 3vw, 31px);
      line-height: 1.4;
      color: #f0f0f0;
      max-width: 760px;
    }

    .accent-dot {
      width: 12px;
      height: 12px;
      margin: 28px 0;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 18px rgba(210, 252, 0, 0.16);
    }

    .copy {
      max-width: 820px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(20px, 2.8vw, 29px);
      line-height: 1.45;
    }

    .eyebrow {
      margin-top: 62px;
      color: var(--accent);
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 28px;
      max-width: 820px;
    }

    .button {
      min-height: 80px;
      border: 1.5px solid var(--accent);
      border-radius: 14px;
      padding: 0 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 650;
      transition:
        background-color 180ms ease,
        color 180ms ease,
        transform 180ms ease,
        box-shadow 180ms ease;
    }

    .button:hover {
      background: var(--accent);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(210, 252, 0, 0.12);
    }

    .button:active {
      transform: translateY(0);
    }

    .icon {
      width: 25px;
      height: 25px;
      flex: 0 0 auto;
    }

    .details {
      margin-top: 56px;
      padding: 34px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      max-width: 860px;
    }

    .detail {
      display: flex;
      align-items: center;
      gap: 15px;
      color: #efefef;
      font-size: clamp(18px, 2vw, 23px);
    }

    .detail .icon {
      color: var(--accent);
    }

    footer {
      margin-top: 34px;
      color: #bdbdbd;
      font-size: 18px;
    }

    footer strong {
      color: #fff;
      font-weight: 650;
    }

    .tiny {
      margin-top: 12px;
      color: #666;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      .page {
        width: min(100% - 28px, var(--max));
        padding-top: 32px;
      }

      .hero {
        margin-top: 58px;
      }

      h1 {
        font-size: clamp(52px, 18vw, 84px);
      }

      .actions,
      .details {
        grid-template-columns: 1fr;
      }

      .button {
        justify-content: flex-start;
        padding-left: 24px;
      }

      .eyebrow {
        margin-top: 50px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
</head>
